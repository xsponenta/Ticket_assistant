# Project configuration. Read by src/llm.py (the only module that calls LLMs).

llm:
  base_url: https://openrouter.ai/api/v1
  timeout_s: 60
  max_attempts: 6                               # retries on 429 / 5xx / timeouts; backoff 1, 2, 4, 8, 16 s + jitter
  cache_dir: .cache/llm                         # disk cache, one JSON file per request
  log_path: logs/llm_calls.jsonl                # one line per call (incl. cache hits and failures)
  models_cache: .cache/openrouter_models.json   # model capabilities from OpenRouter /models, refreshed after 24 h

# OpenRouter model ids per role, chosen from the val bake-off (reports/model_selection.md, decision L2).
models:
  generator: deepseek/deepseek-v4.1-flash-1017   # components C1, C3–C6
  judge: google/gemini-3.5-flash-lite            # LLM-as-judge; different provider than the generator (AGENTS.md)
  simulator: qwen/qwen3.5-27b                    # simulated user in dialogue evals; different family than the generator
  embedder: BAAI/bge-small-en-v1.5               # local sentence-transformers model (CPU) for C2/C3 retrieval; NOT called through src/llm.py (L3)

# Default temperature per role, used when complete(..., temperature=None). The judge is always run at 0.
temperature:
  generator: 0.0
  judge: 0.0
  simulator: 0.7

# Default OpenRouter reasoning setting per role, used when complete(..., reasoning=None) without a model override.
# Always explicit: OpenRouter's metadata is unreliable (models listed as reasoning-off reasoned heavily in the bake-off).
reasoning:
  generator: {effort: none}      # off: same quality, ~2x cheaper and faster than the served default (high)
  judge: {effort: minimal}       # reasoning is mandatory for this model; minimal is its lowest effort
  simulator: {enabled: false}    # off: 100% in character, 5/5 honest in the bake-off
